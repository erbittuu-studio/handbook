# PES standard Dependabot config (see standards/github.md):
# keep GitHub Actions pinned versions fresh; code dependencies are updated
# deliberately, so only security updates are enabled for them (via repo
# settings, not this file).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  # fastlane is what talks to App Store Connect, so a stale pin breaks the
  # store workflows whenever Apple changes an API. Swift dependencies are
  # vendored and updated deliberately; this is tooling, not app code.
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: monthly
