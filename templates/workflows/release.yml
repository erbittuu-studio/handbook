# The logic lives in the handbook; this file is the triggers, the permissions and the pinned version.
# Managed by PES — `update.sh` rewrites it.
name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-merge
  cancel-in-progress: false

jobs:
  release:
    uses: erbittuu-studio/handbook/.github/workflows/app-release.yml@v{{PES_VERSION}}
    with:
      app_name: "{{APP_NAME}}"
    secrets: inherit
