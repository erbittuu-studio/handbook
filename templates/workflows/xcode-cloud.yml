# The logic lives in the handbook; this file is the triggers, the permissions and the pinned version.
# Managed by PES — `update.sh` rewrites it.
name: Xcode Cloud

on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        type: choice
        default: show
        options: [show, manual, build]
      workflow_name:
        description: "Xcode Cloud workflow name"
        type: string
        default: Release
      branch:
        description: "Branch to build (action = build)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  xcode-cloud:
    uses: erbittuu-studio/handbook/.github/workflows/app-xcode-cloud.yml@v{{PES_VERSION}}
    with:
      action: ${{ inputs.action }}
      workflow_name: ${{ inputs.workflow_name }}
      branch: ${{ inputs.branch }}
    secrets: inherit
