# The logic lives in the handbook; this file is the triggers, the permissions and the pinned version.
# Managed by PES — `update.sh` rewrites it.
name: PR

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read   # dorny/paths-filter needs this to list changed files

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr:
    uses: erbittuu-studio/handbook/.github/workflows/app-pr.yml@v{{PES_VERSION}}
    secrets: inherit
