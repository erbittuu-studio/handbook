# The logic lives in the handbook; this file is the triggers, the permissions and the pinned version.
# Managed by PES — `update.sh` rewrites it.
name: Main

on:
  push:
    branches: [main, 'release/**']
    paths:
      # The project file drives the checks in scripts/, so a change to it should run them.
      - "Project.json"
      - "project.yml"
      - "App/Source/**"
      - "App/Packages/**"
      - "App/Vendor/**"
      - "App/{{PROJECT_NAME}}.xcodeproj/**"
      - ".swiftlint.yml"
      # The automation's own files — without these, a broken workflow reaches
      # main and sits there until an unrelated push fails. verify-ci below
      # gives a run on these paths something to actually do.
      - ".github/workflows/**"
      - "scripts/**"
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        type: choice
        default: all
        options: [all, xcode-cloud]

permissions:
  contents: read

jobs:
  main:
    uses: erbittuu-studio/handbook/.github/workflows/app-main.yml@v{{PES_VERSION}}
    with:
      project_name: "{{PROJECT_NAME}}"
      job: ${{ inputs.job }}
    secrets: inherit
