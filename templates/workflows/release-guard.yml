# The logic lives in the handbook; this file is the triggers, the permissions and the pinned version.
# Managed by PES — `update.sh` rewrites it.
name: Release Guard

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-guard:
    uses: erbittuu-studio/handbook/.github/workflows/app-release-guard.yml@v{{PES_VERSION}}
    secrets: inherit
