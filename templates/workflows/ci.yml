# CI: the same file in every app. PES owns it and `update.sh` keeps it current.
#
# Nothing here calls another repo or needs a secret, so nothing outside the app can break it. It never starts an
# Xcode Cloud build either: a build starts only when you run ./build.
#
#   every pull request and push   the checks job, a few seconds of lint and project checks
#   push of release/X.Y.Z         also the release checks (named X.Y.Z, newer than the last tag, changelog section)
#                                 and a simulator compile, so a broken build is found before Apple's long one
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PES_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Pull request title is a conventional commit
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s' "$TITLE" | grep -Eq '^(feat|fix|chore|docs|refactor|test|ci|perf|style|build|revert|release)(\([a-z0-9._-]+\))?!?: .+'; then
            echo "::error::PR title must be '<type>: <what it does>' (feat fix chore docs refactor test ci perf style build revert release), got: $TITLE"
            exit 1
          fi

      - name: SwiftLint
        run: |
          curl -sSL -o swiftlint.zip https://github.com/realm/SwiftLint/releases/download/0.65.0/swiftlint_linux_amd64.zip
          unzip -q swiftlint.zip -d swiftlint-bin
          ./swiftlint-bin/swiftlint lint App

      - name: Secret scan
        run: |
          curl -sSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --no-banner --redact --no-git

      - name: Dependencies are vendored
        run: |
          if grep -q "isa = XCRemoteSwiftPackageReference" App/*.xcodeproj/project.pbxproj; then
            echo "::error::the project references a remote Swift package; everything is vendored locally (PLAYBOOK.md §4)"
            exit 1
          fi
          FOUND=$(find . -name "Package.resolved" -not -path "*/.build/*")
          if [ -n "$FOUND" ]; then
            echo "::error::Package.resolved found; dependencies must resolve to local packages only"
            echo "$FOUND"
            exit 1
          fi

      - name: Firebase analytics flag is on
        run: |
          python3 -c "
          import plistlib
          with open('App/Resources/GoogleService-Info.plist', 'rb') as f:
              assert plistlib.load(f).get('IS_ANALYTICS_ENABLED') is True, 'IS_ANALYTICS_ENABLED must be true'
          "

      - name: Project checks
        run: python3 App/Packages/PES/validate.py

  compile:
    if: github.event_name == 'push' && startsWith(github.ref_name, 'release/')
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build for the simulator
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          MAJOR=$(xcodebuild -version | awk 'NR==1 {print $2}' | cut -d. -f1)
          if [ "$MAJOR" -lt 27 ]; then
            echo "::notice::this runner has Xcode $MAJOR; the project needs the iOS 27 SDK (Xcode 27 or later), so the compile check is skipped"
            exit 0
          fi
          xcodebuild \
            -project "$(bash App/Packages/PES/ci/project_value.sh app.project)" \
            -scheme "$(bash App/Packages/PES/ci/project_value.sh app.scheme)" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
