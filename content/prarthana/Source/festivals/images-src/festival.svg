<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#FFF3DC"/>
      <stop offset="100%" stop-color="#F7D9A4"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD873" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFD873" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="55%" stop-color="#F59E2D"/>
      <stop offset="100%" stop-color="#D96C1E"/>
    </linearGradient>
    <linearGradient id="bowl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C0561B"/>
      <stop offset="100%" stop-color="#8C2F1B"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F2B33D"/>
      <stop offset="100%" stop-color="#D98A24"/>
    </linearGradient>
  </defs>

  <circle cx="256" cy="256" r="240" fill="url(#bg)"/>

  <!-- glow behind flame -->
  <circle cx="256" cy="212" r="118" fill="url(#glow)"/>

  <!-- flame -->
  <path d="M256 128 C 288 178, 302 208, 302 238 C 302 268 282 288 256 288
           C 230 288 210 268 210 238 C 210 208 224 178 256 128 Z" fill="url(#flame)"/>
  <path d="M256 176 C 272 204, 279 222, 279 240 C 279 258 269 269 256 269
           C 243 269 233 258 233 240 C 233 222 240 204 256 176 Z" fill="#FFF3C4"/>

  <!-- diya bowl -->
  <path d="M138 300 L374 300 C 372 356, 322 394, 256 394 C 190 394 140 356 138 300 Z"
        fill="url(#bowl)"/>
  <ellipse cx="256" cy="300" rx="118" ry="22" fill="url(#rim)"/>
  <!-- bowl decoration dots -->
  <circle cx="196" cy="344" r="7" fill="#F2B33D"/>
  <circle cx="256" cy="352" r="7" fill="#F2B33D"/>
  <circle cx="316" cy="344" r="7" fill="#F2B33D"/>

  <!-- base -->
  <path d="M198 394 L314 394 L330 420 L182 420 Z" fill="#8C2F1B"/>
  <rect x="166" y="420" width="180" height="16" rx="8" fill="#C0561B"/>

  <!-- sparkles -->
  <g fill="#E8802A">
    <path d="M132 160 l6 14 14 6 -14 6 -6 14 -6 -14 -14 -6 14 -6 Z"/>
    <path d="M382 150 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5 Z"/>
    <path d="M362 246 l4 9 9 4 -9 4 -4 9 -4 -9 -9 -4 9 -4 Z"/>
    <path d="M148 250 l4 9 9 4 -9 4 -4 9 -4 -9 -9 -4 9 -4 Z"/>
  </g>
</svg>
