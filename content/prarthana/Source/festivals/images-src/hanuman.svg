<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="72%">
      <stop offset="0%" stop-color="#FFEFDD"/>
      <stop offset="100%" stop-color="#F6CD96"/>
    </radialGradient>
    <linearGradient id="gadahead" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F2B33D"/>
      <stop offset="100%" stop-color="#C9821E"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B3641E"/>
      <stop offset="100%" stop-color="#7C3D14"/>
    </linearGradient>
  </defs>

  <circle cx="256" cy="256" r="240" fill="url(#bg)"/>

  <!-- gada (mace), upright -->
  <g transform="translate(256 250) rotate(18)">
    <!-- head -->
    <circle cx="0" cy="-96" r="74" fill="url(#gadahead)"/>
    <circle cx="-22" cy="-118" r="18" fill="#FFE9B8" opacity="0.7"/>
    <!-- head ridges -->
    <g stroke="#A66614" stroke-width="6" fill="none" opacity="0.7">
      <path d="M-52 -148 Q 0 -170 52 -148"/>
      <path d="M-66 -110 Q 0 -134 66 -110"/>
      <path d="M-66 -74 Q 0 -56 66 -74"/>
    </g>
    <!-- crown tip -->
    <path d="M0 -186 l 12 24 -24 0 Z" fill="#8C2F1B"/>
    <circle cx="0" cy="-186" r="9" fill="#C41E3A"/>
    <!-- collar -->
    <rect x="-26" y="-28" width="52" height="18" rx="9" fill="#8C2F1B"/>
    <!-- handle -->
    <rect x="-13" y="-14" width="26" height="180" rx="13" fill="url(#handle)"/>
    <rect x="-20" y="152" width="40" height="22" rx="11" fill="#8C2F1B"/>
    <!-- grip rings -->
    <g fill="#F2B33D">
      <rect x="-15" y="30" width="30" height="8" rx="4"/>
      <rect x="-15" y="70" width="30" height="8" rx="4"/>
      <rect x="-15" y="110" width="30" height="8" rx="4"/>
    </g>
  </g>

  <!-- sindoor tilak mark -->
  <path d="M128 150 c 10 16, 10 30, 0 44 c -10 -14 -10 -28 0 -44 Z" fill="#E8541E"/>

  <!-- sparkles -->
  <g fill="#C0561B">
    <path d="M392 150 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5 Z"/>
    <path d="M120 330 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 Z"/>
    <path d="M396 330 l4 9 9 4 -9 4 -4 9 -4 -9 -9 -4 9 -4 Z"/>
  </g>
</svg>
