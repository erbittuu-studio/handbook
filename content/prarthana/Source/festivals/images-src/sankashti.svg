<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="72%">
      <stop offset="0%" stop-color="#FFF3E2"/>
      <stop offset="100%" stop-color="#F7D9A4"/>
    </radialGradient>
    <linearGradient id="modak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE9B8"/>
      <stop offset="100%" stop-color="#F2B33D"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C0561B"/>
      <stop offset="100%" stop-color="#8C2F1B"/>
    </linearGradient>
  </defs>

  <circle cx="256" cy="256" r="240" fill="url(#bg)"/>

  <!-- crescent moon (sankashti chandra darshan) -->
  <path d="M380 92 a 42 42 0 1 0 29 73 a 34 34 0 1 1 -29 -73 Z" fill="#E8A93C"/>

  <!-- modak body -->
  <path d="M256 108
           C 300 160, 356 220, 366 300
           C 372 352, 322 392, 256 392
           C 190 392, 140 352, 146 300
           C 156 220, 212 160, 256 108 Z" fill="url(#modak)"/>
  <!-- pleats -->
  <g stroke="#D98A24" stroke-width="9" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M256 116 C 244 190, 240 268, 244 376"/>
    <path d="M256 116 C 268 190, 272 268, 268 376"/>
    <path d="M252 124 C 218 196, 200 260, 196 366"/>
    <path d="M260 124 C 294 196, 312 260, 316 366"/>
    <path d="M244 140 C 196 210, 172 268, 162 340"/>
    <path d="M268 140 C 316 210, 340 268, 350 340"/>
  </g>
  <!-- top knot -->
  <circle cx="256" cy="112" r="14" fill="#D98A24"/>

  <!-- plate -->
  <path d="M120 396 L392 396 C 388 428, 332 448, 256 448 C 180 448, 124 428, 120 396 Z"
        fill="url(#plate)"/>
  <ellipse cx="256" cy="396" rx="136" ry="18" fill="#D98A24"/>

  <!-- sparkles -->
  <g fill="#E8802A">
    <path d="M120 150 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5 Z"/>
    <path d="M150 262 l4 9 9 4 -9 4 -4 9 -4 -9 -9 -4 9 -4 Z"/>
    <path d="M392 240 l4 9 9 4 -9 4 -4 9 -4 -9 -9 -4 9 -4 Z"/>
  </g>
</svg>
