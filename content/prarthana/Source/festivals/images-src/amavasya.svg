<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="sky" cx="50%" cy="38%" r="78%">
      <stop offset="0%" stop-color="#2E2F5B"/>
      <stop offset="100%" stop-color="#1A1B38"/>
    </radialGradient>
    <radialGradient id="dark" cx="45%" cy="40%" r="65%">
