    <circle cx="430" cy="236" r="3.5"/>
    <circle cx="82" cy="248" r="3"/>
    <circle cx="140" cy="310" r="2.5"/>
    <circle cx="386" cy="308" r="2.5"/>
    <path d="M338 168 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5 Z"/>
    <path d="M136 196 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 Z"/>
    <path d="M300 70 l4 9 9 4 -9 4 -4 9 -4 -9 -9 -4 9 -4 Z"/>
