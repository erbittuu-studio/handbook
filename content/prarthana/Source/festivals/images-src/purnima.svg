<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="sky" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#3A3D77"/>
      <stop offset="100%" stop-color="#232449"/>
    </radialGradient>
    <radialGradient id="moonglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF2C9" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#FFF2C9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moon" cx="42%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#FFF8E1"/>
      <stop offset="100%" stop-color="#F4D98B"/>
    </radialGradient>
  </defs>

  <circle cx="256" cy="256" r="240" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#EDE3B8">
    <circle cx="120" cy="120" r="4"/>
    <circle cx="392" cy="104" r="3"/>
    <circle cx="424" cy="200" r="4"/>
    <circle cx="88" cy="228" r="3"/>
    <circle cx="150" cy="80" r="2.5"/>
    <circle cx="360" cy="160" r="2.5"/>
    <path d="M330 84 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5 Z"/>
    <path d="M112 176 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 Z"/>
  </g>

  <!-- moon -->
  <circle cx="256" cy="216" r="150" fill="url(#moonglow)"/>
  <circle cx="256" cy="216" r="104" fill="url(#moon)"/>
  <g fill="#E4C77A" opacity="0.55">
    <circle cx="216" cy="184" r="16"/>
    <circle cx="292" cy="164" r="10"/>
    <circle cx="300" cy="248" r="18"/>
    <circle cx="238" cy="262" r="9"/>
    <circle cx="270" cy="206" r="6"/>
  </g>

  <!-- calm water -->
  <g fill="none" stroke="#8B8ED1" stroke-width="10" stroke-linecap="round" opacity="0.85">
    <path d="M116 388 q 35 -22 70 0 t 70 0 t 70 0 t 70 0"/>
    <path d="M150 424 q 35 -20 70 0 t 70 0 t 72 0"/>
  </g>
  <!-- moon reflection -->
  <ellipse cx="256" cy="388" rx="44" ry="8" fill="#F4D98B" opacity="0.5"/>
</svg>
